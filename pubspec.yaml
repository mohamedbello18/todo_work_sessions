name: todo_work_sessions
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.0 
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.3
  package_info_plus: ^8.0.0
  cupertino_icons: ^1.0.8
  uuid: ^4.4.0
  font_awesome_flutter: ^10.7.0
  url_launcher: ^6.2.6
  permission_handler: ^11.3.1
  sound_mode: ^3.1.1
  intl: ^0.19.0
  collection: ^1.18.0
  file_picker: ^8.0.6
  path_provider: ^2.1.3
  open_file: ^3.3.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_native_splash:
  color: "#FFFFFF" 
  image: assets/images/logo.png 
  android_gravity: center
  ios_content_mode: center
